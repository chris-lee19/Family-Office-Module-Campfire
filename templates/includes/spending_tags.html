{% if spend_tags.person or spend_tags.property %}{% if spend_tags.person %}<div class="field{% if compact %} compact{% endif %}"><label{% if compact %} class="sr-only"{% endif %}>For family member</label><select name="tag_person" aria-label="For family member"><option value="">{% if compact %}Family member (optional){% else %}Not for one person{% endif %}</option>{% for id, name in spend_tags.person %}<option value="{{ id }}" {% if chosen.person == id|stringformat:"s" %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>{% endif %}
{% if spend_tags.property %}<div class="field{% if compact %} compact{% endif %}"><label{% if compact %} class="sr-only"{% endif %}>For property</label><select name="tag_property" aria-label="For property"><option value="">{% if compact %}Property (optional){% else %}Not for a property{% endif %}</option>{% for id, name in spend_tags.property %}<option value="{{ id }}" {% if chosen.property == id|stringformat:"s" %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>{% endif %}{% endif %}
