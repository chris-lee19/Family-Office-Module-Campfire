{% load static nav %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Family Office{% endblock %}</title>
  {% if framed %}<script>try { var t = sessionStorage.getItem("fo-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (_) {}</script>{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'fo/app.css' %}">
</head>
<body class="{% if framed %}framed{% endif %}{% if panel %} panel{% endif %}" data-campfire-origin="{{ campfire_origin }}">
  {% if not framed and signed_in %}<div class="app">{% sidebar %}{% endif %}
  <main>{% block content %}{% endblock %}</main>
  {% if not framed and signed_in %}</div>{% endif %}
  {% if framed %}<script src="{% static 'fo/bridge.js' %}"></script>{% endif %}
</body>
</html>
